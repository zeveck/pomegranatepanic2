<style>
  @font-face { font-family: 'Cinzel Decorative'; src: url('fonts/CinzelDecorative-Black.ttf') format('truetype'); font-weight: 900; font-display: block; }
  @font-face { font-family: 'Nunito'; src: url('fonts/Nunito.ttf') format('truetype'); font-weight: 200 1000; font-display: block; }
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d0a1c;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body { background: radial-gradient(ellipse at 50% 100%, #3a1a2e 0%, #160f2a 55%, #0a0716 100%); }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ffd25a; font: 700 20px Nunito, system-ui, sans-serif; letter-spacing: 1px;
  }
  .title-link {
    position: fixed; z-index: 2; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); padding: 6px 4px;
    font: 800 14px Nunito, system-ui, sans-serif; letter-spacing: 0.3px; color: #fff2c0; opacity: 0.7;
    text-decoration: none; text-shadow: 0 1px 3px rgba(10,6,20,0.9), 0 0 2px rgba(10,6,20,0.8);
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  .title-link[hidden] { display: none; }
  .title-link:hover, .title-link:focus-visible { opacity: 1; text-decoration: underline; }
  /* The bug report form: the page's no-select and no-touch styles must not reach it. */
  gh-feedback { -webkit-user-select: text; user-select: text; touch-action: auto; }
  /* ...dressed like the game's own purple-and-gold panels. */
  gh-feedback {
    --gh-feedback-bg: #251a45; --gh-feedback-text: #fff6d8; --gh-feedback-border: #8a72c4;
    --gh-feedback-input-bg: #170f2c;
  }
  #link-site { left: calc(env(safe-area-inset-left, 0px) + 12px); }
  #link-gh { right: calc(env(safe-area-inset-right, 0px) + 12px); }
  /* Phones: smaller, and tucked a little into the home-bar area so they stay clear of the title buttons. */
  @media (pointer: coarse), (max-width: 600px) {
    .title-link { font-size: 11px; padding: 4px 3px; bottom: calc(env(safe-area-inset-bottom, 0px) * 0.4 + 6px); }
  }
  @media (max-width: 380px) {
    .title-link { font-size: 10px; }
    #link-site { left: calc(env(safe-area-inset-left, 0px) + 8px); }
    #link-gh { right: calc(env(safe-area-inset-right, 0px) + 8px); }
  }

<body>
<div id="safe"></div>
<div id="loading">Loading…</div>
<canvas id="game" aria-label="Pomegranate Panic 2 game"></canvas>
<a class="title-link" id="link-site" href="https://synapticnoise.com/" hidden>synapticnoise.com</a>
<a class="title-link" id="link-gh" href="https://github.com/zeveck/pomegranatepanic2" target="_blank" rel="noopener" title="Pomegranate Panic 2 on GitHub: how it was made" aria-label="Pomegranate Panic 2 on GitHub: how it was made" hidden>GitHub</a>
<script>
  // Ctrl+Shift+F opens the bug report from anywhere, even if the game is stuck.
  // Its own script, before the game's, so an error in the game can't stop it.
  addEventListener('keydown', (e) => {
    if (!e.ctrlKey || !e.shiftKey || e.altKey || e.metaKey || e.key.toLowerCase() !== 'f') return;
    const fb = document.getElementById('report');
    if (!fb?.getAttribute('repo') || document.activeElement === fb) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    try { window.reportShortcut?.(); } catch {}   // the game pauses, if it still can
    fb.open();
  }, true);
</script>
<script type="module" src="js/main.js"></script>
<script>
  const local = ['localhost', '127.0.0.1'].includes(location.hostname);
  if ('serviceWorker' in navigator && (!local || new URLSearchParams(location.search).has('sw'))) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
<script type="module" src="vendor/gh-feedback.js"></script>
<gh-feedback id="report" trigger="none" repo="zeveck/pomegranatepanic2" template="bug.yml"
  types="bug,feature" theme="dark" color="#e9a93a" popup-color="#e9a93a"></gh-feedback>
</body>
